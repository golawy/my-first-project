<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .hero {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      padding: 80px 20px;
      border-radius: 16px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: white;
      color: #1d4ed8;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Welcome to My Website</h1>
      <p>This is a clean landing page example you can customize.</p>
      <a href="#" class="btn">Get Started</a>
    </section>

    <section class="features">
      <div class="card">
        <h2>Feature 1</h2>
        <p>Great for showcasing services, products, or ideas.</p>
      </div>
      <div class="card">
        <h2>Feature 2</h2>
        <p>Simple layout that looks professional on desktop and mobile.</p>
      </div>
      <div class="card">
        <h2>Feature 3</h2>
        <p>Easy to modify for your brand colors, text, and content.</p>
      </div>
    </section>
  </div>
</body>
</html>
